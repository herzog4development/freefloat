[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-float-top3"
version = "0.1.0"
description = "Hello world: top companies by free-float market cap, from companiesmarketcap.com"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freefloat = "freefloat.cli:main"

[tool.setuptools.package-data]
freefloat = ["float_factors.json"]
